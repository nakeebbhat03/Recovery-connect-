<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery Connect — Check-in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <div class="section-pad" style="display:flex; align-items:center; justify-content:space-between;">
    <p style="font-size:13px; font-weight:600;">Daily check-in</p>
    <a href="home.html" style="width:28px; height:28px; border-radius:50%; background:var(--green-soft); display:flex; align-items:center; justify-content:center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
  </div>

  <div class="ring-stage">
    <p style="font-size:12px; color:var(--inksoft);">Tap the ring that matches your craving level</p>
    <div class="ring-target" id="ringTarget">
      <button class="ring" data-lvl="1" style="width:56px; height:56px;"></button>
      <button class="ring" data-lvl="2" style="width:92px; height:92px;"></button>
      <button class="ring" data-lvl="3" style="width:128px; height:128px;"></button>
      <button class="ring" data-lvl="4" style="width:164px; height:164px;"></button>
      <button class="ring" data-lvl="5" style="width:200px; height:200px;"></button>
      <div class="ring-core" id="ringCore"></div>
    </div>
    <p class="serif" id="levelLabel" style="font-size:20px; margin-top:26px;">Steady</p>
    <p style="font-size:12px; color:var(--inksoft); margin-top:2px;" id="levelNum">Level 2 of 5</p>
  </div>

  <div class="section-pad" style="margin-top:auto;">
    <div id="counselorNote" style="display:none; margin-bottom:12px; background:#F6E3D4; color:#7A4A22; padding:10px 14px; border-radius:14px; font-size:11.5px;">
      This will be shared with your counselor for a same-day follow-up.
    </div>
    <button class="pill-dark" style="width:100%; padding:14px;" onclick="saveCheckin()">Save today's check-in</button>
  </div>

  <div style="height:20px;"></div>
</div>

<script src="script.js"></script>
<script>
  const labels = {1:"Calm", 2:"Steady", 3:"Uneasy", 4:"Strong urge", 5:"Overwhelming"};
  let craving = 2;

  function paint() {
    document.querySelectorAll('.ring').forEach(r => {
      const lvl = parseInt(r.dataset.lvl);
      r.classList.toggle('active', craving >= lvl);
      r.classList.toggle('warn', craving >= lvl && craving >= 4);
    });
    document.getElementById('ringCore').classList.toggle('warn', craving >= 4);
    document.getElementById('levelLabel').textContent = labels[craving];
    document.getElementById('levelNum').textContent = `Level ${craving} of 5`;
    document.getElementById('counselorNote').style.display = craving >= 4 ? 'block' : 'none';
  }

  document.querySelectorAll('.ring').forEach(r => {
    r.addEventListener('click', () => { craving = parseInt(r.dataset.lvl); paint(); });
  });

  function saveCheckin() {
    const history = JSON.parse(localStorage.getItem('rc_checkins') || '[]');
    history.push({ date: new Date().toISOString(), level: craving });
    localStorage.setItem('rc_checkins', JSON.stringify(history));
    alert('Check-in saved. Take care of yourself today.');
    window.location.href = 'home.html';
  }

  paint();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery Connect — AI Support</title>
<link rel="stylesheet" href="style.css">
<style>
  .chat-shell {
    max-width: 420px; margin: 0 auto; min-height: 100vh;
    background: var(--bg); display: flex; flex-direction: column;
  }
  .chat-top {
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .chat-top-info { display: flex; align-items: center; gap: 10px; }
  .chat-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--header); display: flex; align-items: center; justify-content: center;
  }
  .chat-close {
    width: 30px; height: 30px; border-radius: 50%; background: var(--green-soft);
    display: flex; align-items: center; justify-content: center; color: var(--ink);
  }
  .chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 11px 14px; border-radius: 16px; font-size: 12.5px; line-height: 1.5; }
  .msg.user { align-self: flex-end; background: var(--header); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--green-soft); color: var(--ink); border-bottom-left-radius: 4px; }
  .msg.bot.typing { font-style: italic; opacity: 0.7; }

  .risk-card {
    align-self: stretch; margin-top: 4px;
    background: var(--header); color: #fff;
    border-radius: 16px; padding: 16px;
  }
  .risk-title { display: flex; align-items: center; gap: 6px; color: var(--lime); font-weight: 700; font-size: 12.5px; }
  .risk-body { font-size: 12px; margin-top: 8px; line-height: 1.55; color: #E7ECE6; }
  .risk-num { font-size: 12px; margin-top: 10px; color: var(--lime); font-weight: 700; }
  .risk-btn { margin-top: 12px; width: 100%; background: var(--lime); color: var(--header); font-weight: 700; font-size: 12.5px; padding: 11px; border-radius: 999px; text-align: center; }

  .chat-input-row {
    display: flex; gap: 8px; padding: 12px 16px 18px;
    border-top: 1px solid var(--line); background: var(--surface);
  }
  .chat-input-row input {
    flex: 1; padding: 12px 16px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 13px; outline: none;
  }
  .chat-send {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    background: var(--header); color: var(--lime);
    display: flex; align-items: center; justify-content: center;
  }
  .chat-disclaimer { text-align: center; font-size: 10px; color: var(--inksoft); padding: 6px 16px 0; }
</style>
</head>
<body>

<div class="chat-shell">
  <div class="chat-top">
    <div class="chat-top-info">
      <div class="chat-avatar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--lime)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8 15c1 1 2 1.5 4 1.5s3-.5 4-1.5"/></svg>
      </div>
      <div>
        <p style="font-size:13px; font-weight:700;">AI Support Chat</p>
        <p style="font-size:10.5px; color:var(--inksoft);">Anonymous · Available now</p>
      </div>
    </div>
    <a href="home.html" class="chat-close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
  </div>

  <div class="chat-log" id="chatLog"></div>

  <p class="chat-disclaimer">This AI listens and supports — it doesn't diagnose, and never replaces a licensed professional.</p>

  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="Type how you're feeling…" onkeydown="if(event.key==='Enter') sendMsg()">
    <button class="chat-send" onclick="sendMsg()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg>
    </button>
  </div>
</div>

<script src="script.js"></script>
<script>
  const log = document.getElementById('chatLog');
  let escalated = false;

  function addMsg(text, who) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  function addRiskCard() {
    const d = document.createElement('div');
    d.className = 'risk-card';
    d.innerHTML = `
      <div class="risk-title">⚠ Risk language detected</div>
      <div class="risk-body">You don't have to go through this alone. I'm connecting you to a human counselor right now — they'll be with you shortly.</div>
      <div class="risk-num">Tele-MANAS: 14416 &nbsp;·&nbsp; De-addiction Helpline: 1800-11-0031</div>
      <div class="risk-btn" onclick="alert('Connecting you to a human counselor now. Please stay on this screen.')">Talk to a human counselor now</div>
    `;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  const RISK_WORDS = ['no point', "don't see the point", "see no point", "what's the point", 'give up', "can't go on", 'end it', 'end my life', 'worthless', 'suicide', 'kill myself', 'not worth living', "don't want to be here", 'hopeless', 'better off without me', 'why bother', 'not worth trying', "can't do this anymore"];
  const CRAVING_WORDS = ['craving', 'urge', 'want to use', 'relapse', 'using again', 'need a hit'];
  const ANXIETY_WORDS = ['anxious', 'panic', "can't breathe", 'racing thoughts', 'worried', 'overwhelmed'];
  const SAD_WORDS = ['sad', 'depressed', 'empty', 'tired of everything', "can't sleep", 'exhausted', 'numb'];

  const RESPONSES = {
    craving: [
      "That sounds really hard to carry alone. Let's slow down for a second — can you tell me what's feeling strongest right now, the craving or the exhaustion?",
      "Cravings usually peak and pass within 15-20 minutes. Try naming 3 things you can see around you right now, slowly.",
    ],
    anxiety: [
      "That racing feeling is exhausting. Let's try something small — breathe in for 4 counts, hold for 4, out for 4. Want to try it with me?",
      "You're safe right now, even if it doesn't feel that way. Can you tell me one thing that's true in this exact moment?",
    ],
    sad: [
      "That sounds heavy to carry. You don't have to have the energy to fix everything right now — just this next hour is enough.",
      "Low days are real days too. Is there one small thing — water, sitting up, opening a window — you could do right now?",
    ],
    generic: [
      "I'm here and I'm listening. Can you tell me a bit more about what's going on?",
      "Thank you for sharing that with me. What would feel even a little bit helpful right now?",
      "That makes sense given what you're dealing with. Do you want coping suggestions, or just to talk it through?",
    ],
  };

  let genericIdx = 0, cravingIdx = 0, anxietyIdx = 0, sadIdx = 0;

  function containsAny(text, list) {
    return list.some(w => text.includes(w));
  }

  function botReply(userText) {
    const t = userText.toLowerCase();

    if (containsAny(t, RISK_WORDS)) {
      escalated = true;
      setTimeout(addRiskCard, 500);
      return;
    }

    let reply;
    if (containsAny(t, CRAVING_WORDS)) {
      reply = RESPONSES.craving[cravingIdx++ % RESPONSES.craving.length];
    } else if (containsAny(t, ANXIETY_WORDS)) {
      reply = RESPONSES.anxiety[anxietyIdx++ % RESPONSES.anxiety.length];
    } else if (containsAny(t, SAD_WORDS)) {
      reply = RESPONSES.sad[sadIdx++ % RESPONSES.sad.length];
    } else {
      reply = RESPONSES.generic[genericIdx++ % RESPONSES.generic.length];
    }

    const typing = addMsg('typing…', 'bot typing');
    setTimeout(() => {
      typing.remove();
      addMsg(reply, 'bot');
    }, 650);
  }

  function sendMsg() {
    if (escalated) return;
    const input = document.getElementById('chatInput');
    const val = input.value.trim();
    if (!val) return;
    addMsg(val, 'user');
    input.value = '';
    botReply(val);
  }

  // opening message
  addMsg("Hi, I'm here to listen — anything you say stays anonymous. What's going on?", 'bot');
</script>
</body>
</html>

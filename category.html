<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery Connect — What brings you here</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <div class="util-bar on-light" id="utilBarTop"></div>

  <div class="section-pad" style="padding-top:10px;">
    <p class="login-eyebrow" style="color:var(--green);">Before we begin</p>
    <h1 class="serif" style="font-size:22px; margin-top:8px; line-height:1.35;">What brings you here today?</h1>
    <p style="font-size:12.5px; color:var(--inksoft); margin-top:8px; line-height:1.5;">This just helps us show you the right kind of support. You can change it anytime.</p>
  </div>

  <div class="section-pad" style="padding-top:6px;">
    <button class="cat-card" data-cat="addiction" onclick="choose('addiction')">
      <div class="cat-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c4-4 8-7.58 8-12A8 8 0 0 0 4 10c0 4.42 4 8 8 12Z"/></svg></div>
      <div>
        <p style="font-size:13.5px; font-weight:700;">Substance addiction</p>
        <p style="font-size:11.5px; color:var(--inksoft); margin-top:2px;">Craving, dependency, recovery from substance use</p>
      </div>
    </button>

    <button class="cat-card" data-cat="anxiety" onclick="choose('anxiety')">
      <div class="cat-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/><circle cx="12" cy="12" r="4"/></svg></div>
      <div>
        <p style="font-size:13.5px; font-weight:700;">Anxiety</p>
        <p style="font-size:11.5px; color:var(--inksoft); margin-top:2px;">Constant worry, racing thoughts, panic</p>
      </div>
    </button>

    <button class="cat-card" data-cat="depression" onclick="choose('depression')">
      <div class="cat-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 15s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/><circle cx="12" cy="12" r="9"/></svg></div>
      <div>
        <p style="font-size:13.5px; font-weight:700;">Depression</p>
        <p style="font-size:11.5px; color:var(--inksoft); margin-top:2px;">Low mood, loss of interest, exhaustion</p>
      </div>
    </button>

    <button class="cat-card" data-cat="other" onclick="choose('other')">
      <div class="cat-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v.01M12 8v5"/></svg></div>
      <div>
        <p style="font-size:13.5px; font-weight:700;">Something else / not sure</p>
        <p style="font-size:11.5px; color:var(--inksoft); margin-top:2px;">That's okay — we'll help you figure it out</p>
      </div>
    </button>
  </div>

  <div class="section-pad">
    <button class="btn-primary" onclick="continueNext()">Continue</button>
  </div>
</div>

<script src="script.js"></script>
<script>
  renderUtilBar ? null : null;
  document.getElementById('utilBarTop').className = 'util-bar on-light';
  document.getElementById('utilBarTop').innerHTML = `<button class="util-btn" id="themeBtn" onclick="toggleTheme()">${document.body.classList.contains('dark') ? '☀' : '☾'}</button>`;

  let picked = null;
  function choose(cat) {
    picked = cat;
    document.querySelectorAll('.cat-card').forEach(c => c.classList.toggle('selected', c.dataset.cat === cat));
  }
  function continueNext() {
    setCategory(picked || 'addiction');
    window.location.href = 'home.html';
  }
</script>
</body>
</html>
